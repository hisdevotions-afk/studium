<!doctype html>
<meta charset="utf-8" />
<style>
  body { width: 260px; font-family: system-ui; background: #141414; color: #fff; padding: 12px; margin: 0; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 4px 0; font-size: 13px; color: #bbb; }
  #count { color: #fff; font-weight: bold; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; }
  /* Apple-style on/off switch */
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: #787880; border-radius: 31px; transition: background .2s; }
  .slider::before { content: ""; position: absolute; height: 27px; width: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .2s; }
  input:checked + .slider { background: #34c759; }
  input:checked + .slider::before { transform: translateX(20px); }
</style>
<h1>Studium</h1>
<p>Ativo em <b>netflix.com/watch</b>: clique numa palavra da legenda para pausar e ver a explicação.</p>
<p><span id="count">…</span> palavras salvas no vocabulário.</p>
<div class="row">
  <span>Extensão ativa</span>
  <label class="switch"><input type="checkbox" id="toggle" /><span class="slider"></span></label>
</div>
<script type="module" src="./popup.ts"></script>
